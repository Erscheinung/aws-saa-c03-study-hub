<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS SAA-C03 Orbital Mind Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #1a2332;
            --accent-orange: #ff6b35;
            --accent-blue: #4facfe;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --compute: #ef4444;
            --storage: #3b82f6;
            --database: #8b5cf6;
            --network: #10b981;
            --security: #f59e0b;
            --integration: #ec4899;
            --analytics: #06b6d4;
            --management: #84cc16;
            --ml: #f472b6;
            --iot: #0ea5e9;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Space Grotesk',sans-serif; background:var(--bg-primary); color:var(--text-primary); overflow:hidden; height:100vh; }

        #starCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }

        #mapContainer { position:relative; width:100vw; height:100vh; overflow:hidden; cursor:grab; z-index:1; }
        #mapContainer:active { cursor:grabbing; }
        #map { position:absolute; width:4000px; height:3000px; transform-origin:center center; }

        /* SVG orbital paths */
        #orbitSvg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        .orbit-path { fill:none; stroke-width:1.5; opacity:0.3; }
        .orbit-path.glow { stroke-width:3; opacity:0.15; filter:blur(4px); }

        @keyframes orbitDash { to { stroke-dashoffset: -1000; } }
        .orbit-path.animated { stroke-dasharray:8 16; animation: orbitDash 40s linear infinite; }

        /* Central hub */
        .central-hub {
            position:absolute; left:1935px; top:1435px; width:130px; height:130px;
            background:linear-gradient(135deg, var(--accent-orange), var(--accent-blue));
            border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
            font-weight:700; text-align:center; z-index:50; cursor:pointer;
            box-shadow: 0 0 60px rgba(255,107,53,0.5), 0 0 120px rgba(255,107,53,0.2);
            transition: all 0.3s;
        }
        .central-hub:hover { transform:scale(1.1); box-shadow: 0 0 80px rgba(255,107,53,0.7); }

        /* Nodes */
        .node {
            position:absolute; border-radius:50%; display:flex; flex-direction:column;
            align-items:center; justify-content:center; cursor:pointer; transition:all 0.3s;
            text-align:center; border:3px solid; background:var(--bg-card);
            z-index:10;
        }
        .node.main { width:80px; height:80px; }
        .node.sub { width:60px; height:60px; border-width:2px; background:rgba(26,35,50,0.8); }

        .node:hover { transform:scale(1.2); z-index:100; }
        .node.dimmed { opacity:0.15; filter:grayscale(0.8); }

        .node-label { font-weight:600; font-size:0.65rem; line-height:1.2; pointer-events:none; }
        .node.sub .node-label { font-size:0.55rem; }

        /* Category colors */
        .node.compute { border-color:var(--compute); }
        .node.storage { border-color:var(--storage); }
        .node.database { border-color:var(--database); }
        .node.network { border-color:var(--network); }
        .node.security { border-color:var(--security); }
        .node.integration { border-color:var(--integration); }
        .node.analytics { border-color:var(--analytics); }
        .node.management { border-color:var(--management); }
        .node.ml { border-color:var(--ml); }
        .node.iot { border-color:var(--iot); }

        .node.compute:hover { box-shadow:0 0 30px var(--compute); }
        .node.storage:hover { box-shadow:0 0 30px var(--storage); }
        .node.database:hover { box-shadow:0 0 30px var(--database); }
        .node.network:hover { box-shadow:0 0 30px var(--network); }
        .node.security:hover { box-shadow:0 0 30px var(--security); }
        .node.integration:hover { box-shadow:0 0 30px var(--integration); }
        .node.analytics:hover { box-shadow:0 0 30px var(--analytics); }
        .node.management:hover { box-shadow:0 0 30px var(--management); }
        .node.ml:hover { box-shadow:0 0 30px var(--ml); }
        .node.iot:hover { box-shadow:0 0 30px var(--iot); }

        /* Tooltip on hover */
        .node-tooltip {
            position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%);
            background:rgba(10,14,23,0.95); border:1px solid var(--accent-orange);
            padding:8px 14px; border-radius:10px; white-space:nowrap; font-size:0.75rem;
            pointer-events:none; opacity:0; transition:opacity 0.2s; z-index:200;
            max-width:220px; white-space:normal; text-align:center;
        }
        .node-tooltip .tt-name { color:var(--accent-orange); font-weight:600; }
        .node-tooltip .tt-desc { color:var(--text-secondary); font-size:0.7rem; margin-top:3px; }
        .node:hover .node-tooltip { opacity:1; }

        /* Category labels */
        .cat-label {
            position:absolute; font-size:0.8rem; font-weight:700; padding:6px 14px;
            border-radius:20px; background:var(--bg-card); border:2px solid; z-index:15;
            cursor:pointer; transition:all 0.3s; letter-spacing:1px;
        }
        .cat-label:hover { transform:scale(1.05); }
        .cat-label.dimmed { opacity:0.2; }
        .cat-label.compute { border-color:var(--compute); color:var(--compute); }
        .cat-label.storage { border-color:var(--storage); color:var(--storage); }
        .cat-label.database { border-color:var(--database); color:var(--database); }
        .cat-label.network { border-color:var(--network); color:var(--network); }
        .cat-label.security { border-color:var(--security); color:var(--security); }
        .cat-label.integration { border-color:var(--integration); color:var(--integration); }
        .cat-label.analytics { border-color:var(--analytics); color:var(--analytics); }
        .cat-label.management { border-color:var(--management); color:var(--management); }
        .cat-label.ml { border-color:var(--ml); color:var(--ml); }
        .cat-label.iot { border-color:var(--iot); color:var(--iot); }

        /* Controls */
        .controls { position:fixed; top:20px; left:20px; z-index:1000; display:flex; flex-direction:column; gap:8px; }
        .ctrl-btn {
            width:44px; height:44px; border-radius:10px; border:2px solid var(--accent-orange);
            background:var(--bg-primary); color:var(--accent-orange); font-size:1.3rem;
            cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s;
        }
        .ctrl-btn:hover { background:var(--accent-orange); color:var(--bg-primary); }

        .back-btn {
            position:fixed; top:20px; right:20px; z-index:1000; padding:10px 22px;
            border-radius:30px; border:2px solid var(--accent-blue); background:var(--bg-primary);
            color:var(--accent-blue); font-family:inherit; font-size:0.9rem; cursor:pointer;
            text-decoration:none; transition:all 0.2s;
        }
        .back-btn:hover { background:var(--accent-blue); color:var(--bg-primary); }

        .zoom-level {
            position:fixed; bottom:20px; left:20px; background:var(--bg-card);
            padding:8px 16px; border-radius:20px; font-family:'JetBrains Mono',monospace;
            font-size:0.8rem; z-index:1000;
        }

        .legend {
            position:fixed; top:20px; left:50%; transform:translateX(-50%); display:flex;
            gap:10px; flex-wrap:wrap; justify-content:center; z-index:1000;
            background:rgba(10,14,23,0.95); padding:10px 20px; border-radius:25px;
            border:1px solid var(--accent-orange); max-width:90vw;
        }
        .legend-item { display:flex; align-items:center; gap:5px; font-size:0.7rem; }
        .legend-dot { width:10px; height:10px; border-radius:50%; }

        /* Sidebar */
        .sidebar {
            position:fixed; right:-440px; top:0; width:440px; height:100vh;
            background:var(--bg-card); border-left:2px solid var(--accent-orange);
            z-index:2000; overflow-y:auto; padding:30px;
            box-shadow:-5px 0 30px rgba(0,0,0,0.6);
            transition: right 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        .sidebar.open { right:0; }
        .sidebar-close {
            position:absolute; top:18px; right:18px; background:transparent;
            border:2px solid #ef4444; color:#ef4444; width:36px; height:36px;
            border-radius:50%; font-size:1.3rem; cursor:pointer; display:flex;
            align-items:center; justify-content:center; transition:all 0.2s;
        }
        .sidebar-close:hover { background:#ef4444; color:var(--bg-primary); transform:rotate(90deg); }
        .sidebar-content h2 {
            font-size:1.6rem; margin-bottom:12px;
            background:linear-gradient(135deg,var(--accent-orange),var(--accent-blue));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .sidebar-section { margin:20px 0; }
        .sidebar-section h3 { color:var(--accent-orange); font-size:1rem; margin-bottom:8px; }
        .sidebar-section p,.sidebar-section li { color:var(--text-secondary); line-height:1.7; margin:6px 0; }
        .sidebar-section ul { list-style:none; }
        .sidebar-section li::before { content:"▸ "; color:var(--accent-blue); font-weight:bold; margin-right:6px; }
        .limit-badge {
            display:inline-block; background:rgba(255,107,53,0.2); color:var(--accent-orange);
            padding:3px 10px; border-radius:12px; font-family:'JetBrains Mono',monospace;
            font-size:0.8rem; margin:3px 3px 3px 0;
        }

        @media (max-width:768px) {
            .legend { display:none; }
            .sidebar { width:100vw; right:-100vw; }
            .sidebar.open { right:0; }
            .controls { top:auto; bottom:20px; left:50%; transform:translateX(-50%); flex-direction:row; }
            .zoom-level { display:none; }
        }
    </style>
</head>
<body>
<canvas id="starCanvas"></canvas>

<div class="controls">
    <button class="ctrl-btn" onclick="zoomIn()" title="Zoom In">+</button>
    <button class="ctrl-btn" onclick="zoomOut()" title="Zoom Out">-</button>
    <button class="ctrl-btn" onclick="centerView()" title="Center">&#8962;</button>
    <button class="ctrl-btn" onclick="resetFocus()" title="Reset">&#9673;</button>
</div>

<a href="../index.html" class="back-btn">&larr; Back to Hub</a>

<div class="legend">

    <div class="legend-item"><div class="legend-dot" style="background:var(--storage)"></div>Storage</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--database)"></div>Database</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--network)"></div>Network</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--security)"></div>Security</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--integration)"></div>Integration</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--analytics)"></div>Analytics</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--management)"></div>Management</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--ml)"></div>ML &amp; AI</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--iot)"></div>IoT</div>
</div>

<div class="zoom-level" id="zoomLevel">Zoom: 100%</div>

<div class="sidebar" id="sidebar">
    <button class="sidebar-close" onclick="closeSidebar()">&times;</button>
    <div class="sidebar-content" id="sidebarContent"></div>
</div>

<div id="mapContainer">
    <div id="map">
        <svg id="orbitSvg" viewBox="0 0 4000 3000" xmlns="http://www.w3.org/2000/svg"></svg>

            <div style="font-size:1.1rem;">AWS</div>
            <div style="font-size:0.7rem;font-weight:400;">SAA-C03</div>
        </div>
    </div>
</div>

function initStars() {

    const stars = Array.from({length:200}, () => ({
        x: Math.random()*c.width, y: Math.random()*c.height,
        r: Math.random()*1.5+0.3, phase: Math.random()*Math.PI*2, speed: Math.random()*0.02+0.005
    }));
    function draw(t) {
        ctx.clearRect(0,0,c.width,c.height);
        stars.forEach(s => {
            const a = 0.3 + 0.7 * Math.abs(Math.sin(s.phase + t * s.speed));
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
    window.addEventListener('resize', () => { c.width = window.innerWidth; c.height = window.innerHeight; });
}

// ── Compute node positions using polar coordinates ──
function computePositions() {
    const positions = {};
    Object.keys(categories).forEach(catKey => {
        const cat = categories[catKey];
        const baseAngle = cat.angle * Math.PI / 180;
        // Get main services in this category
        const mainSvcs = Object.entries(serviceData).filter(([k,v]) => v.cat === catKey && !v.sub);
        const subSvcs = Object.entries(serviceData).filter(([k,v]) => v.cat === catKey && v.sub);

        // Spread main services along the orbital arc (±18 degrees around category angle)
        const spread = 16 * Math.PI / 180;
        mainSvcs.forEach(([key, svc], i) => {
            const count = mainSvcs.length;
            const offset = count === 1 ? 0 : (i / (count-1) - 0.5) * 2 * spread;
            const a = baseAngle + offset;
            positions[key] = {
                x: CX + cat.rx * Math.cos(a) - 40,
                y: CY + cat.ry * Math.sin(a) - 40,
                main: true
            };
        });

        // Sub-services placed in outer ring
        subSvcs.forEach(([key, svc], i) => {
            const count = subSvcs.length;
            const subSpread = 20 * Math.PI / 180;
            const offset = count === 1 ? 0 : (i / (count-1) - 0.5) * 2 * subSpread;
            const a = baseAngle + offset;
            const outerRx = cat.rx + 120;
            const outerRy = cat.ry + 100;
            positions[key] = {
                x: CX + outerRx * Math.cos(a) - 30,
                y: CY + outerRy * Math.sin(a) - 30,
                main: false
            };
        });

        // Category label position
        const labelRx = cat.rx - 80;
        const labelRy = cat.ry - 60;
        positions['__label_'+catKey] = {
            x: CX + labelRx * Math.cos(baseAngle) - 40,
            y: CY + labelRy * Math.sin(baseAngle) - 15
        };
    });
    return positions;
}

// ── Create orbital SVG paths ──
function createOrbits() {
    const svg = document.getElementById('orbitSvg');
    Object.entries(categories).forEach(([catKey, cat]) => {
        // Main orbit ellipse
        const el = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
        el.setAttribute('cx', CX); el.setAttribute('cy', CY);
        el.setAttribute('rx', cat.rx); el.setAttribute('ry', cat.ry);
        el.setAttribute('class','orbit-path animated');
        el.setAttribute('stroke', cat.color);
        el.setAttribute('data-cat', catKey);
        svg.appendChild(el);
        // Glow copy
        const gl = el.cloneNode(); gl.setAttribute('class','orbit-path glow');
        gl.setAttribute('stroke', cat.color);
        gl.setAttribute('data-cat', catKey);
        svg.appendChild(gl);
        // Outer orbit for sub-nodes
        const hasSubNodes = Object.values(serviceData).some(s => s.cat === catKey && s.sub);
        if (hasSubNodes) {
            const outer = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
            outer.setAttribute('cx', CX); outer.setAttribute('cy', CY);
            outer.setAttribute('rx', cat.rx + 120); outer.setAttribute('ry', cat.ry + 100);
            outer.setAttribute('class','orbit-path animated');
            outer.setAttribute('stroke', cat.color); outer.style.opacity = '0.15';
            outer.setAttribute('data-cat', catKey);
            svg.appendChild(outer);
        }
    });
}

// ── Create nodes ──
function createNodes(positions) {
    const mapEl = document.getElementById('map');
    Object.entries(serviceData).forEach(([key, svc]) => {
        const pos = positions[key];
        if (!pos) return;
        const node = document.createElement('div');
        node.className = `node ${pos.main ? 'main' : 'sub'} ${svc.cat}`;
        node.style.left = pos.x + 'px'; node.style.top = pos.y + 'px';
        node.dataset.cat = svc.cat; node.dataset.svc = key;
        node.onclick = (e) => { e.stopPropagation(); showServiceDetails(key); };
        node.innerHTML = `<div class="node-label">${svc.name}</div>
            <div class="node-tooltip"><div class="tt-name">${svc.name}</div><div class="tt-desc">${svc.desc}</div></div>`;
        mapEl.appendChild(node);
    });
    // Category labels
    Object.entries(categories).forEach(([catKey, cat]) => {
        const pos = positions['__label_'+catKey];
        if (!pos) return;
        const lbl = document.createElement('div');
        lbl.className = `cat-label ${catKey}`;
        lbl.style.left = pos.x + 'px'; lbl.style.top = pos.y + 'px';
        lbl.textContent = cat.label;
        lbl.onclick = () => focusCategory(catKey);
        document.getElementById('map').appendChild(lbl);
    });
}

// ── Transform / Pan / Zoom ──
function updateTransform() {
    map.style.transform = `translate(${translateX}px,${translateY}px) scale(${scale})`;
    document.getElementById('zoomLevel').textContent = `Zoom: ${Math.round(scale*100)}%`;
}
function centerView() {
    const r = container.getBoundingClientRect();
    scale = 0.55;
    translateX = (r.width - 4000*scale) / 2;
    translateY = (r.height - 3000*scale) / 2;
    updateTransform();
}
function zoomAtPoint(f, px, py) {
    const ns = Math.max(0.2, Math.min(2.5, scale*f));
    const c = ns/scale;
    translateX = px - (px-translateX)*c;
    translateY = py - (py-translateY)*c;
    scale = ns; updateTransform();
}
function zoomIn() { const r=container.getBoundingClientRect(); zoomAtPoint(1.25,r.width/2,r.height/2); }
function zoomOut() { const r=container.getBoundingClientRect(); zoomAtPoint(0.8,r.width/2,r.height/2); }

function animMomentum() {
    if (Math.abs(velX)>0.1||Math.abs(velY)>0.1) {
        translateX+=velX; translateY+=velY; velX*=0.92; velY*=0.92;
        updateTransform(); animFrame=requestAnimationFrame(animMomentum);
    }
}
function stopMomentum() { if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;} velX=velY=0; }

function attachListeners() {
    container.addEventListener('mousedown', e => {
        stopMomentum(); isDragging=true; startX=e.clientX; startY=e.clientY;
        lastTX=translateX; lastTY=translateY; container.style.cursor='grabbing'; e.preventDefault();
    });
    container.addEventListener('mousemove', e => {
        if(!isDragging) return;
        const dx=e.clientX-startX, dy=e.clientY-startY;
        velX=(lastTX+dx-translateX)*0.3; velY=(lastTY+dy-translateY)*0.3;
        translateX=lastTX+dx; translateY=lastTY+dy; updateTransform();
    });
    container.addEventListener('mouseup', () => { if(isDragging){isDragging=false;container.style.cursor='grab';animMomentum();} });
    container.addEventListener('mouseleave', () => { if(isDragging){isDragging=false;container.style.cursor='grab';} });
    container.addEventListener('wheel', e => {
        e.preventDefault(); stopMomentum();
        const s = Math.abs(e.deltaY)<50?0.002:0.001;
        zoomAtPoint(Math.max(0.9,Math.min(1.1,1-e.deltaY*s)), e.clientX, e.clientY);
    }, {passive:false});
    // Touch
    let lastDist=0;
    container.addEventListener('touchstart', e => {
        if(e.touches.length===1){stopMomentum();isDragging=true;startX=e.touches[0].clientX;startY=e.touches[0].clientY;lastTX=translateX;lastTY=translateY;}
        else if(e.touches.length===2){lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
        e.preventDefault();
    },{passive:false});
    container.addEventListener('touchmove', e => {
        if(e.touches.length===1&&isDragging){translateX=lastTX+(e.touches[0].clientX-startX);translateY=lastTY+(e.touches[0].clientY-startY);updateTransform();}
        else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(lastDist>0){const mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;zoomAtPoint(d/lastDist,mx,my);}lastDist=d;}
        e.preventDefault();
    },{passive:false});
    container.addEventListener('touchend',()=>{isDragging=false;lastDist=0;});
}

// ── Focus ──
function focusCategory(cat) {
    if(focusCat===cat){resetFocus();return;}
    focusCat=cat;
    document.querySelectorAll('.node').forEach(n=>{n.classList.toggle('dimmed',n.dataset.cat!==cat);});
    document.querySelectorAll('.cat-label').forEach(l=>{l.classList.toggle('dimmed',!l.classList.contains(cat));});
    document.querySelectorAll('.orbit-path').forEach(p=>{p.style.opacity=p.getAttribute('data-cat')===cat?'0.6':'0.05';});
}
function resetFocus() {
    focusCat=null;
    document.querySelectorAll('.node').forEach(n=>n.classList.remove('dimmed'));
    document.querySelectorAll('.cat-label').forEach(l=>l.classList.remove('dimmed'));
    document.querySelectorAll('.orbit-path').forEach(p=>{p.style.opacity='';});
}

// ── Sidebar ──
function showServiceDetails(id) {
    const d = serviceData[id]; if(!d) return;
    const sb = document.getElementById('sidebar');
    document.getElementById('sidebarContent').innerHTML = `
        <h2>${d.name}</h2>
        <p style="color:var(--text-secondary);margin-bottom:18px;">${d.desc}</p>
        ${d.details.length?`<div class="sidebar-section"><h3>Key Features</h3><ul>${d.details.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
        ${d.limits.length?`<div class="sidebar-section"><h3>Important Limits</h3>${d.limits.map(l=>`<span class="limit-badge">${l}</span>`).join('')}</div>`:''}
        ${d.useCase?`<div class="sidebar-section"><h3>Use Cases</h3><p>${d.useCase}</p></div>`:''}
    `;
    sb.classList.add('open');
}
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

// ── Keyboard ──
document.addEventListener('keydown', e => {
    if(e.key==='+'||e.key==='=') zoomIn();
    if(e.key==='-') zoomOut();
    if(e.key==='0') centerView();
    if(e.key==='Escape'){closeSidebar();resetFocus();}
});

// ── Init ──
function initMap() {
    map = document.getElementById('map');
    container = document.getElementById('mapContainer');
    if(!map||!container) return;
    initStars();
    createOrbits();
    const pos = computePositions();
    createNodes(pos);
    attachListeners();
    centerView();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initMap);
else initMap();
window.addEventListener('load',()=>{if(map&&container)centerView();});
</script>
</body>
